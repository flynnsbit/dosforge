name: Release Linux bundle

# Triggered when a unified ``v<X.Y.Z>`` tag is pushed (one release
# per version, hosting both Linux and Windows assets under the
# same release).  Was previously ``linux-v*`` (separate Linux
# release); changed in v0.7.2 per user request to consolidate
# assets under one release.
#
# This workflow:
#   1. Idempotently ensures the v<X.Y.Z> GitHub release exists.
#   2. Builds a pip-installable wheel + sdist + a self-contained
#      source tarball with install instructions.
#   3. Uploads the Linux artifacts to that release with --clobber.
#
# The Windows workflow (release.yml) listens on the same tag and
# uploads its bundles to the same release in parallel.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build the release for (e.g. v0.7.2)'
        required: true
        type: string

permissions:
  contents: write  # required for `gh release create` / `gh release upload`

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Compute version from tag
        id: vars
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # v0.7.2 -> 0.7.2  (matches pyproject.toml version)
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Verify dosassets folder skeleton
        run: python scripts/check-dosassets-readmes.py

      - name: Verify wheel-bundled _skeleton mirror is in sync with dosassets/
        run: python scripts/sync-asset-skeleton.py --check

      - name: Build sdist + wheel
        run: |
          python -m build --sdist --wheel --outdir dist/

      - name: Verify wheel installs cleanly and CLI works
        run: |
          python -m venv /tmp/venv-smoke
          /tmp/venv-smoke/bin/pip install --upgrade pip
          /tmp/venv-smoke/bin/pip install dist/*.whl
          /tmp/venv-smoke/bin/dosforge --help | head -20
          /tmp/venv-smoke/bin/dosforge create --help | head -5
          /tmp/venv-smoke/bin/dosforge check-deps --help | head -5
          # init-assets smoke: hydrate into a temp dir and verify content.
          /tmp/venv-smoke/bin/dosforge init-assets --target /tmp/dosassets-smoke
          test -f /tmp/dosassets-smoke/msdos622/readme.txt
          test -f /tmp/dosassets-smoke/pcdos71/readme.txt
          # Expected count is whatever the wheel ships, computed at runtime.
          expected=$(/tmp/venv-smoke/bin/python -c \
            'from dosforge.asset_skeleton import iter_skeleton_modes; print(len(iter_skeleton_modes()))')
          echo "expected skeleton modes: $expected"
          # Re-running should skip everything (idempotent).
          /tmp/venv-smoke/bin/dosforge init-assets --target /tmp/dosassets-smoke \
              | tee /tmp/dosassets-rerun.txt
          grep -q "skipped: ${expected}" /tmp/dosassets-rerun.txt
          # --force should refresh every readme.
          /tmp/venv-smoke/bin/dosforge init-assets --target /tmp/dosassets-smoke --force \
              | tee /tmp/dosassets-force.txt
          grep -q "updated: ${expected}" /tmp/dosassets-force.txt

      - name: Assemble Linux release tarball with install instructions
        run: |
          ver='${{ steps.vars.outputs.version }}'
          stage="dosforge-${ver}-linux"
          mkdir -p "$stage"
          cp dist/*.whl dist/*.tar.gz "$stage/"
          cp -r dosassets "$stage/"
          cp -r scripts "$stage/"
          [ -f README.md ] && cp README.md "$stage/" || true
          [ -f docs/CHANGELOG.md ] && cp docs/CHANGELOG.md "$stage/" || true
          cat > "$stage/INSTALL.md" <<EOF
          # dosforge Linux install (v${ver})

          ## 1. Install the Python package

              python3 -m venv .venv
              . .venv/bin/activate
              pip install ./dosforge-${ver}-py3-none-any.whl

          ## 2. Install the system tools dosforge shells out to

              # Debian / Ubuntu
              sudo apt install qemu-system-x86 qemu-utils nbd-client \\
                  mtools p7zip-full innoextract python3-tk

              # Fedora / RHEL
              sudo dnf install qemu-system-x86 qemu-img nbd mtools \\
                  p7zip p7zip-plugins innoextract python3-tkinter

              # Arch
              sudo pacman -S qemu-base qemu-img nbd mtools p7zip \\
                  innoextract tk

          ## 3. Run

              dosforge                # help + examples
              dosforge create --help  # full create reference
              dosforge tui            # interactive TUI
              dosforge gui            # desktop GUI (needs X11 / Wayland + Tk)

          ## 4. Where to put DOS install media

          dosforge looks for install diskettes in (resolution order,
          highest priority first):

            1. \\\$DOSFORGE_DOSASSETS_DIR if you've exported one
            2. \\\$PWD/dosassets/ — handy when you extract this bundle
               and run dosforge from inside it
            3. \\\$XDG_DATA_HOME/dosforge/dosassets/
               (defaults to ~/.local/share/dosforge/dosassets/)
            4. ~/.dosforge/dosassets/
            5. /usr/local/share/dosforge/dosassets/
            6. /usr/share/dosforge/dosassets/

          Run \`dosforge where-assets\` any time to see which of these
          paths currently exist.

          **Recommended for pip-only installs** (you want to run
          dosforge from any directory):

              # Materialize the per-mode folder + readme.txt skeleton
              # under ~/.local/share/dosforge/dosassets/. The readmes
              # ship inside the wheel itself.
              dosforge init-assets

          Then drop your install media into the matching
          \`~/.local/share/dosforge/dosassets/<mode>/\` folder. Each
          folder ships a readme.txt explaining the expected filenames.

          **Or if you want a fixed location elsewhere**:

              # In ~/.bashrc or ~/.zshrc
              export DOSFORGE_DOSASSETS_DIR=/path/to/your/dosassets

          ## 5. IBM PC-DOS 7.1 specifically

          PC-DOS 7.1 (FAT32 + LBA) was only ever distributed inside
          the IBM ServerGuide Scripting Toolkit. ibm.com no longer
          hosts it but the Internet Archive preserves a verified
          mirror. Populate your dosassets/pcdos71/ from it with:

              python3 scripts/fetch-pcdos71-assets.py

          The script verifies the downloaded installer by SHA-1 and
          each extracted file by SHA-256 against community-published
          reference hashes.

          ## What's bootable on Linux

          Every DOS boot mode that works on Windows works on Linux
          too — qemu-nbd handles the disk-prep phase, qemu-system
          handles the in-guest install. Per-DOS authentic MBR
          (FDISK /MBR) and FAT16/FAT32 BPB geometry are applied
          identically on both platforms because they run inside the
          DOS guest.
          EOF
          tar czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" dist/*.whl dist/*.tar.gz
          echo "stage_tarball=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.vars.outputs.tag }}'
          ver='${{ steps.vars.outputs.version }}'
          notes="releases/${tag}-release-notes.md"
          title="dosforge ${ver}"

          # Single-release model (v0.7.2+): Linux + Windows assets
          # both upload to the same v<X.Y.Z> release.  Whichever
          # workflow gets here first creates it; subsequent attempts
          # see "release already exists" and skip.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; will upload Linux artifacts to it."
          else
            if [ -f "$notes" ]; then
              gh release create "$tag" --title "$title" --notes-file "$notes" \
                || echo "Release was created concurrently by another workflow."
            else
              gh release create "$tag" --title "$title" --generate-notes \
                || echo "Release was created concurrently by another workflow."
            fi
            echo "Release stamped at https://github.com/${{ github.repository }}/releases/tag/$tag"
          fi

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.vars.outputs.tag }}'
          gh release upload "$tag" \
            "$stage_tarball" \
            dist/*.whl \
            dist/*.tar.gz \
            --clobber
          echo "Uploaded Linux artifacts to $tag"
