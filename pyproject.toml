[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dosforge"
version = "0.1.0"
description = "Textual TUI for creating and managing DOS-compatible VHD and floppy IMG files on Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shawn" }]
dependencies = [
  "textual>=0.65.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dosforge = "dosforge.cli:main"
# Legacy CLI name for users who installed the project as `vhdmaker`.
# Prints a deprecation notice and forwards to the `dosforge` entry point.
# Plan to drop in a future release once users have migrated.
vhdmaker = "dosforge.cli:_legacy_vhdmaker_entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "native_linux: integration tests that use native Linux mount/fsck tooling and require privileged loop mounts",
  "native_boot: integration tests that boot images in QEMU and validate runtime boot markers",
  "native_86box: integration tests that execute external 86Box boot command contracts",
]
