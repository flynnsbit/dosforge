[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dosforge"
version = "0.9.39"
description = "Textual TUI + Windows 11 GUI for creating and managing DOS-compatible VHD and floppy IMG files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shawn" }]
dependencies = [
  "textual>=0.65.0",
  "py7zr>=0.21",
  "sv-ttk>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dosforge = "dosforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dosforge._skeleton" = ["**/readme.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "native_linux: integration tests that use native Linux mount/fsck tooling and require privileged loop mounts",
  "native_boot: integration tests that boot images in QEMU and validate runtime boot markers",
  "native_86box: integration tests that execute external 86Box boot command contracts",
]
